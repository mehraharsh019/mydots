<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>
    Make JetBrainsMono Nerd Font Mono the default for every generic family
    (sans, sans-serif, serif, monospace) with Noto/DejaVu/Liberation fallbacks.
  </description>

  <!-- ==================================================================
       1. Canonicalise the JetBrains Mono Nerd Font family names
       ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
       The Nerd Fonts release ships the same typeface under several family
       names ("Mono", "NF", "NL", "Propo"). Point the common ones at the
       Mono variant so an app asking for "JetBrainsMono Nerd Font" gets the
       exact same face as "monospace".

       NL (no-ligatures) and Propo (proportional) are intentionally left
       alone, so you can still request those explicitly.
       ================================================================== -->

  <alias binding="strong">
    <family>JetBrainsMono Nerd Font</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>

  <alias binding="strong">
    <family>JetBrainsMono NF</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>

  <alias binding="strong">
    <family>JetBrainsMonoMono Nerd Font</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>

  <alias binding="strong">
    <family>JetBrainsMonoMono NF</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>

  <!-- ==================================================================
       2. The generic families
       ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
       Order matters: fontconfig walks the list per-glyph, so the first
       family that actually contains the character wins. JetBrains Mono
       leads, everything behind it only fills holes (symbols, CJK, emoji).

       Fallbacks are chosen to exist on essentially every distro:
         Noto       - upstream Google, in Fedora/Arch/Debian/Ubuntu/openSUSE
         Liberation - metric-compatible with Arial/Times/Courier
         DejaVu     - covers a very wide symbol/math range
       Fonts that are not installed are simply skipped, so keeping an
       extra name in the list is harmless.
       ================================================================== -->

  <!-- sans / sans-serif: proportional text. JetBrains Mono first, then a
       real proportional sans for glyphs it lacks (e.g. it has no italics
       for every script, no CJK, no wide maths). -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
      <family>Noto Sans Symbols 2</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>sans</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
      <family>Noto Sans Symbols 2</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <!-- serif: JetBrains Mono is monospaced, so anything it *does* cover is
       rendered monospaced. Noto Serif is the proportional safety net for
       scripts/symbols JetBrains Mono has no glyph for. -->
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
      <family>Liberation Serif</family>
      <family>Noto Sans Symbols 2</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>

  <!-- monospace: JetBrains Mono already covers Latin + Nerd glyphs; the
       fallbacks are for scripts it lacks and for the rare app that asks
       for a fixed pitch but bold/italic JetBrains Mono cannot fake. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Liberation Mono</family>
      <family>Noto Sans Symbols 2</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans Mono CJK JP</family>
    </prefer>
  </alias>

  <!-- ==================================================================
       3. UI / app-specific generic names
       ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
       GTK, Qt, Chromium and Electron apps usually ask for "system-ui" or
       "system", never for "sans-serif". Without these two blocks a lot of
       applications keep showing the old font even though the generic
       families are remapped.
       Comment this section out if you only want terminals and editors.
       ================================================================== -->

  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>system</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Liberation Mono</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>terminal</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Liberation Mono</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- ==================================================================
       4. Math
       ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
       JetBrains Mono has no maths glyphs at all, so without this every
       formula falls back to whatever fontconfig picks by chance.
       ================================================================== -->

  <alias binding="strong">
    <family>math</family>
    <prefer>
      <family>STIX Two Math</family>
      <family>Noto Sans Math</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- ==================================================================
       5. Emoji
       ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
       45-generic.conf already aliases "emoji" weakly. Bind it strongly so
       colour emoji win over any monochrome symbol font.
       ================================================================== -->

  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
